name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COLOR: 1
  DEBUG: 1

jobs:
  illumos:
    name: Test (illumos, OmniOS r151058)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/omnios-vm@v1
        with:
          # Comes with build-essential, for the linker and C compiler.
          release: r151058-build
          copyback: false
          envs: COLOR DEBUG
          run: |
            make
            make check
            make test
